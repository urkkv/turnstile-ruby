AllCops:
  TargetRubyVersion: 2.7
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "demo/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

Naming/FileName:
  Exclude:
    - "lib/turnstile-ruby.rb"

Gemspec/RequireMFA:
  Enabled: false

Metrics:
  Enabled: false
